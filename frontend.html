<!DOCTYPE html>
<html>
<head>
<title>Smart Study Planner</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f9;
}

.navbar{
background:#2c3e50;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
}

.navbar ul{
list-style:none;
display:flex;
gap:20px;
margin:0;
}

.navbar ul li{
cursor:pointer;
}

.container{
width:80%;
margin:auto;
margin-top:30px;
}

.section{
display:none;
}

.active{
display:block;
}

.form-box{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
}

input,select{
padding:10px;
margin:10px;
}

button{
padding:10px 20px;
background:#3498db;
color:white;
border:none;
border-radius:5px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

th{
background:#34495e;
color:white;
}

</style>
</head>

<body>

<div class="navbar">
<h2>Smart Study Planner</h2>

<ul>
<li onclick="showSection('dashboard')">Dashboard</li>
<li onclick="showSection('schedule')">Schedule</li>
<li onclick="showSection('analytics')">Analytics</li>
</ul>
</div>

<div class="container">

<!-- Dashboard -->

<div id="dashboard" class="section active">

<div class="form-box">

<h3>Add Study Task</h3>

<input type="text" id="subject" placeholder="Subject">

<input type="date" id="date">

<select id="difficulty">
<option>Easy</option>
<option>Medium</option>
<option>Hard</option>
</select>

<button onclick="addTask()">Add Task</button>
<p id="message" style="color:green;font-weight:bold;"></p>
</div>

</div>



<div id="schedule" class="section">

<h3>Study Schedule</h3>

<table>

<thead>
<tr>
<th>Subject</th>
<th>Date</th>
<th>Difficulty</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>
<div id="analytics" class="section">

<h3>Study Difficulty Analytics</h3>

<canvas id="chart"></canvas>

</div>

</div>

<script>

let tasks=[]
let easy=0
let medium=0
let hard=0

function showSection(section){

document.querySelectorAll(".section").forEach(s=>{
s.classList.remove("active")
})

document.getElementById(section).classList.add("active")

}

function addTask(){

let subject=document.getElementById("subject").value
let date=document.getElementById("date").value
let difficulty=document.getElementById("difficulty").value

tasks.push({subject,date,difficulty})

updateTable()
updateChart()

document.getElementById("message").innerText="✅ Task Added Successfully!"

document.getElementById("subject").value=""
document.getElementById("date").value=""

}

function updateTable(){

let body=""

tasks.forEach(t=>{

body+=`
<tr>
<td>${t.subject}</td>
<td>${t.date}</td>
<td>${t.difficulty}</td>
</tr>
`

})

document.getElementById("tableBody").innerHTML=body

}

let chart=new Chart(document.getElementById("chart"),{

type:"pie",

data:{
labels:["Easy","Medium","Hard"],
datasets:[{
data:[easy,medium,hard]
}]
}

})

function updateChart(){

chart.data.datasets[0].data=[easy,medium,hard]
chart.update()

}

</script>

</body>
</html>
